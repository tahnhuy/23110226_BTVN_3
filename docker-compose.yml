version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: uteshop_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-uteshop_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # One-shot: runs after MySQL is healthy, then exits (does not keep running).
  # Included in `docker compose up -d` with mysql and redis.
  seed:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    env_file:
      - .env
    command: sh -c "[ -d node_modules ] || npm ci; npm run seed"
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: uteshop_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
